{{ template "header.html" . }}

<h1>{{ .payload.Title }}</h1>

<p>
  Penulis: {{ .payload.Author }} | Stok tersedia: {{ .payload.Stock }}
</p>

<p>{{ .payload.Description }}</p>

<!-- UPDATE -->
<form action="/updateBook/{{ .payload.ID }}" method="get" style="display:inline;">
  <input type="hidden" name="auth" value="{{ .auth }}">
  <button type="submit" class="btn btn-primary">Update</button>
</form>

<!-- DELETE -->
<form action="/deleteBook/{{ .payload.ID }}" method="post" style="display:inline; margin-left:10px;">
  <input type="hidden" name="auth" value="{{ .auth }}">
  <button type="submit" class="btn btn-danger" onclick="return confirm('Yakin ingin menghapus buku ini?')">
    Delete
  </button>
</form>

{{ template "footer.html" . }}
